# Flatpak build: flatpak-builder --user --force-clean --repo=repo build packaging/io.github.ht686.VoxelForge.yml
id: io.github.ht686.VoxelForge
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: voxelforge
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all                         # the scanner and the graphics card
  - --filesystem=home                    # projects and exports
  - --filesystem=host-os:ro              # finds slicers and their icons
  - --filesystem=/var/lib/flatpak:ro     # the same for slicers installed as Flatpak
  - --talk-name=org.freedesktop.Flatpak  # starts slicers and the desktop's file dialogs
modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_SHARED_LIBS=OFF, -DGLFW_BUILD_EXAMPLES=OFF, -DGLFW_BUILD_TESTS=OFF, -DGLFW_BUILD_DOCS=OFF]
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        tag: '3.4'
  - name: voxelforge
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DVOXELFORGE_NATIVE=OFF, -DFETCHCONTENT_SOURCE_DIR_IMGUI=/run/build/voxelforge/imgui-src]
    post-install:
      - install -Dm644 packaging/voxelforge.png /app/share/icons/hicolor/512x512/apps/io.github.ht686.VoxelForge.png
      - sed -e 's/^Icon=.*/Icon=io.github.ht686.VoxelForge/' -e 's/^StartupWMClass=.*/StartupWMClass=io.github.ht686.VoxelForge/' packaging/voxelforge.desktop > io.github.ht686.VoxelForge.desktop
      - install -Dm644 io.github.ht686.VoxelForge.desktop /app/share/applications/io.github.ht686.VoxelForge.desktop
      - install -Dm644 packaging/io.github.ht686.VoxelForge.metainfo.xml /app/share/metainfo/io.github.ht686.VoxelForge.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip: [build, .git, research, .flatpak-builder, dist, repo]
      - type: git
        url: https://github.com/ocornut/imgui.git
        tag: v1.91.9b
        dest: imgui-src
